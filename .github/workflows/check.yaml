on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0
        with:
          tools: calcit,caps

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - run: caps --ci

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --check

      - run: cargo build --release

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_http.so)"
          grep -q ' calcit_ffi_async_version$' <<<"$exports"
          grep -q ' fetch_calcit_ffi_async_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|fetch)$' <<<"$exports"

      - run: rm -rfv dylibs/* && mkdir -p dylibs/ && cp -v target/release/libcalcit_http.so dylibs/

      - name: Validate Calcit API, examples, and docs
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru analyze check-examples --ns fetch.core --def fetch
          calcit calcit.cirru docs check-md README.md --entry calcit.cirru --failures-only
          calcit calcit.cirru docs check-md docs/async-fetch.md --entry calcit.cirru --failures-only
      - run: bash scripts/check-cancel-ffi.sh
      - run: calcit calcit.cirru --warn-dyn-method --check-only
      - run: calcit calcit.cirru analyze check-types --summary-only --format json
      - run: calcit calcit.cirru analyze weak-types --intent unresolved --summary-only --format json
      - run: calcit calcit.cirru analyze deprecated --summary-only --format json
      - run: calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
      - name: Validate FFI Interface IR lowering
        run: |
          calcit calcit.cirru ffi export --json > /tmp/calcit-fetch-ffi-interface-ir.json
          jq -e '
            .data.summary == {"definitions":1,"diagnostics":3,"supported":0,"unsupported":1}
            and (.data.interface.definitions[0].lowering.backend == "native")
            and (.data.interface.definitions[0].lowering.invoke == "async")
            and (.data.interface.definitions[0].lowering.kind == "async-request")
            and (.data.interface.definitions[0].lowering.symbol == "fetch")
            and (.data.interface.definitions[0].lowering.transport == "async-task-v1")
            and (([.diagnostics[] | [.code, .path]] | sort) == ([
              ["E_FFI_IR_DYNAMIC_TYPE", "signature.parameters.1.type"],
              ["E_FFI_IR_CALLBACK_TYPE", "signature.parameters.2.type"],
              ["E_FFI_IR_HOST_MANAGED_TYPE", "signature.result"]
            ] | sort))
          ' /tmp/calcit-fetch-ffi-interface-ir.json
