on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: calcit-lang/setup-calcit@v1.3.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo build --release

      - run: cargo clippy -- -D warnings

      - run: cargo test

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_http.so)"
          grep -q ' calcit_ffi_async_version$' <<<"$exports"
          grep -q ' fetch_calcit_ffi_async_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|fetch)$' <<<"$exports"

      - run: rm -rfv dylibs/* && mkdir -p dylibs/ && cp -v target/release/libcalcit_http.so dylibs/

      - run: calcit calcit.cirru --check-only
      - run: calcit calcit.cirru --warn-dyn-method --check-only
      - run: calcit calcit.cirru analyze check-types --summary-only --format json
      - run: calcit calcit.cirru analyze weak-types --intent unresolved --summary-only --format json
      - run: calcit calcit.cirru analyze deprecated --summary-only --format json
